<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ate Denise – Payment Ledger</title>
<style>
:root{--bg1:#eef2ff;--bg2:#f8fafc;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e8edf5;--brand:#4f46e5;--good:#059669;--goodbg:#ecfdf5;--warn:#e11d48}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:28px 14px 48px;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto}
.eyebrow{text-align:center;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--brand);font-weight:700;margin-bottom:6px}
h1{margin:0 0 22px;text-align:center;font-size:clamp(1.4rem,4.5vw,2rem);letter-spacing:-.02em}
.hero{background:var(--card);border-radius:22px;padding:26px;display:flex;align-items:center;justify-content:space-between;gap:20px;box-shadow:0 10px 40px rgba(79,70,229,.10);margin-bottom:14px}
.hero small{display:block;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.big{font-size:clamp(2rem,8vw,3rem);font-weight:800;letter-spacing:-.03em;color:var(--warn);line-height:1}
.hero .sub{margin-top:10px;color:var(--muted);font-size:.9rem}
.ring{position:relative;width:128px;height:128px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .track{stroke:var(--line)}
.ring .fill{stroke:var(--good);transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring .label{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:800;font-size:1.5rem}
.ring .label span{display:block;font-size:.65rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--card);border-radius:16px;padding:16px 18px;box-shadow:0 2px 12px rgba(15,23,42,.05)}
.stat small{display:block;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.stat b{font-size:1.25rem;letter-spacing:-.01em}
.stat.good b{color:var(--good)}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel{background:var(--card);border-radius:18px;padding:8px 8px 4px;box-shadow:0 2px 12px rgba(15,23,42,.05);overflow:hidden}
.panel.full{grid-column:1/-1}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;padding:12px 14px;border-bottom:1px solid var(--line)}
td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:.95rem}
tbody tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
th.num{text-align:right}
tbody tr:hover{background:#f8faff}
tfoot td{font-weight:800;background:#f8faff;border-top:2px solid var(--line);border-bottom:0}
.amt-good{color:var(--good);font-weight:600}
.tag{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:99px;background:var(--goodbg);color:var(--good);font-size:.65rem;font-weight:700;letter-spacing:.04em;vertical-align:middle}
.start td{color:var(--muted)}
.foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:18px}
@media(max-width:680px){.panels{grid-template-columns:1fr}.hero{padding:20px}.ring{width:104px;height:104px}.ring svg{width:104px;height:104px}.ring .label{font-size:1.2rem}}
.wrap{max-width:720px}</style>
</head>
<body>

<!--
=====================================================================
  HOW TO UPDATE
  EASIEST (automatic): paste your Google Sheet link inside the quotes
  of SHEET_URL below, one time. After that, just add a new row
  (Date, Amount) in the Google Sheet. No need to open GitHub again.

  WITHOUT A GOOGLE SHEET: leave SHEET_URL empty and add a line like
  ["3/10/2026", 5000],  at the end of the PAYMENTS list, then click
  Commit changes.
=====================================================================
-->
<script>
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQZoUhgFFTgbJCbeiKJYZcUfLT2ldiffrCcZBbHAOjUSU-qyLM6xVlXlp8Vf5CgsAL32HEPjs6dgM6v/pub?gid=0&single=true&output=csv";
const ORIGINAL_BALANCE = 180000;

const PAYMENTS = [
  ["8/4/2025",    5000],
  ["10/3/2025",   2000],
  ["10/10/2025",  2000],
  ["11/12/2025", 12000],
  ["12/13/2025",  3000],
  ["12/20/2025",  3000],
  ["1/3/2026",    3000],
  ["1/29/2026",   9000],
  ["2/27/2026",  12000],
];
</script>
<!-- ===================== END OF EDITABLE PART ===================== -->

<div class="wrap">
  <div class="eyebrow">Payment Tracker</div>
  <h1>Ate Denise – Payment Ledger</h1>

  <div class="hero">
    <div>
      <small>Remaining Balance</small>
      <div class="big" id="rb">—</div>
      <div class="sub" id="latest"></div>
    </div>
    <div class="ring"><svg width="128" height="128" viewBox="0 0 128 128"><circle class="track" cx="64" cy="64" r="52" fill="none" stroke-width="12"/><circle id="ringfill" class="fill" cx="64" cy="64" r="52" fill="none" stroke-width="12" stroke-linecap="round"/></svg><div class="label"><div id="pct">0%<span>paid</span></div></div></div>
  </div>

  <div class="stats">
    <div class="stat"><small>Original Balance</small><b id="ob">—</b></div>
    <div class="stat good"><small>Total Payments</small><b id="tp">—</b></div>
    <div class="stat"><small>Payments Made</small><b id="cnt">—</b></div>
  </div>

  <div class="panels">
    <div class="panel full">
      <table>
        <thead><tr><th>Date</th><th class="num">Payment</th><th class="num">Remaining Balance</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
  <div class="foot" id="upd"></div>
</div>

<script>
/* shared helpers (inlined into each page) */
const peso = n => "₱" + Math.round(n).toLocaleString("en-US");
const parseDate = s => {
  s = String(s).trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return new Date(+m[3], +m[1]-1, +m[2]);
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  return null;
};
const fmtDate = d => (d.getMonth()+1) + "/" + d.getDate() + "/" + d.getFullYear();
const fmtLong = d => d.toLocaleDateString("en-US", {month:"short", day:"numeric", year:"numeric"});
function parseCSV(text){
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ","){ row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r"){ if (c === "\r" && text[i+1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += c;
  }
  if (cur || row.length){ row.push(cur); rows.push(row); }
  return rows;
}
/* returns [[Date, amount], ...] sorted by date; ignores header/blank rows */
function entriesFromCSV(text){
  return parseCSV(text).map(r => [parseDate(r[0] || ""), parseFloat(String(r[1] || "").replace(/[^0-9.\-]/g, ""))])
    .filter(r => r[0] && !isNaN(r[1])).sort((a,b) => a[0] - b[0]);
}
function entriesFromList(list){
  return list.map(r => [parseDate(r[0]), r[1]]).filter(r => r[0]).sort((a,b) => a[0] - b[0]);
}
async function loadEntries(sheetUrl, fallbackList){
  if (sheetUrl){
    try{
      const res = await fetch(sheetUrl + (sheetUrl.includes("?") ? "&" : "?") + "t=" + Date.now(), {cache:"no-store"});
      if (!res.ok) throw new Error(res.status);
      const e = entriesFromCSV(await res.text());
      if (e.length) return {entries:e, live:true};
    }catch(err){ /* fall back to the saved list below */ }
  }
  return {entries: entriesFromList(fallbackList), live:false};
}
function setRing(pct){
  const c = document.getElementById("ringfill"), len = 2*Math.PI*52;
  c.style.strokeDasharray = len;
  c.style.strokeDashoffset = len;
  requestAnimationFrame(() => requestAnimationFrame(() => c.style.strokeDashoffset = len * (1 - pct/100)));
}

loadEntries(SHEET_URL, PAYMENTS).then(({entries, live}) => {
  const total = entries.reduce((s, r) => s + r[1], 0), remaining = ORIGINAL_BALANCE - total;
  const pct = Math.max(0, Math.min(100, Math.round(total / ORIGINAL_BALANCE * 1000) / 10));
  const last = entries[entries.length - 1];
  document.getElementById("rb").textContent = peso(remaining);
  document.getElementById("ob").textContent = peso(ORIGINAL_BALANCE);
  document.getElementById("tp").textContent = peso(total);
  document.getElementById("cnt").textContent = entries.length;
  document.getElementById("pct").innerHTML = pct + "%<span>paid</span>";
  document.getElementById("latest").textContent = last ? "Latest payment: " + peso(last[1]) + " on " + fmtLong(last[0]) : "";
  document.getElementById("upd").textContent = last ? "Last updated: " + fmtLong(last[0]) : "";
  let bal = ORIGINAL_BALANCE;
  let html = `<tr class="start"><td>Start</td><td class="num">—</td><td class="num">${peso(bal)}</td></tr>`;
  entries.forEach((e, i) => {
    bal -= e[1];
    html += `<tr><td>${fmtDate(e[0])}${i === entries.length - 1 ? '<span class="tag">LATEST</span>' : ''}</td><td class="num amt-good">${peso(e[1])}</td><td class="num">${peso(bal)}</td></tr>`;
  });
  document.getElementById("rows").innerHTML = html;
  setRing(pct);
});
</script>
</body>
</html>
